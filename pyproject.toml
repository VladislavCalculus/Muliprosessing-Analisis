[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlt-signal-processing"
version = "0.1.0"
description = "WAV input and digital signal processing for the MLT audio project"
requires-python = ">=3.10"
dependencies = ["numpy>=2.1,<3", "scipy>=1.15,<2"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "coverage>=7.9,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["audio_io", "audio_pipeline", "signal_proc"]

[tool.coverage.report]
show_missing = true
skip_empty = true

