[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlt-signal-processing"
version = "0.1.0"
description = "Digital signal processing stage for the MLT audio project"
requires-python = ">=3.10"
dependencies = ["numpy>=2.1,<3", "scipy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]

